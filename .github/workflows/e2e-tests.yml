# Runs the end-to-end tests (tests/VirtoCommerce.SalesRep.Tests, categories StorefrontE2E and VCShellAppE2E) on
# demand: the module from the branch the run starts on, against the vc-frontend branch, tag or commit given, built
# here. The module CI leaves these tests out (Category=IntegrationTest), and nothing requires this run.
name: E2E tests

on:
  workflow_dispatch:
    inputs:
      frontend:
        description: 'vc-frontend branch, tag or commit to test against. Empty: its latest release.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Named, so GitHub runs each step with pipefail: a failed `dotnet test | tee` must fail the step.
    defaults:
      run:
        shell: bash
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      HUSKY: '0'
    steps:
      - name: Checkout the module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vc-module-sales-rep
          persist-credentials: false

      - name: Pick the storefront
        id: storefront
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND: ${{ inputs.frontend }}
        run: |
          ref="$FRONTEND"
          if [ -z "$ref" ]; then
            # The newest theme release: the repository also publishes its facade as core-v* releases.
            ref=$(gh release list --repo VirtoCommerce/vc-frontend --exclude-drafts --exclude-pre-releases --limit 30 \
              --json tagName --jq '[.[] | select(.tagName | test("^[0-9]+[.][0-9]+[.][0-9]+$"))][0].tagName')
          fi
          echo "vc-frontend: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout vc-frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VirtoCommerce/vc-frontend
          ref: ${{ steps.storefront.outputs.ref }}
          path: vc-frontend
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The installs run no package scripts (YARN_ENABLE_SCRIPTS=false: Yarn 2+ has no --ignore-scripts); the builds
      # need none.
      - name: Build the storefront
        working-directory: vc-frontend
        run: |
          corepack enable
          YARN_ENABLE_SCRIPTS=false yarn install --immutable
          yarn build-only

      - name: Build the hub plugin
        working-directory: vc-module-sales-rep/src/VirtoCommerce.SalesRep.Web/StorefrontApp
        run: |
          YARN_ENABLE_SCRIPTS=false yarn install --immutable
          yarn build

      - name: Build the VC-Shell app
        working-directory: vc-module-sales-rep/src/VirtoCommerce.SalesRep.Web/App
        run: |
          YARN_ENABLE_SCRIPTS=false yarn install --immutable
          yarn build:app

      # A new NuGet advisory is the module CI's business; here it would only stop the run.
      - name: Build the tests
        working-directory: vc-module-sales-rep
        run: dotnet build tests/VirtoCommerce.SalesRep.Tests/VirtoCommerce.SalesRep.Tests.csproj -p:NuGetAudit=false

      - name: Install Chromium
        working-directory: vc-module-sales-rep
        run: pwsh tests/VirtoCommerce.SalesRep.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The tests serve the build; the clone it came from gives the contract test its .graphql documents.
      - name: Run the E2E tests
        working-directory: vc-module-sales-rep
        env:
          VC_STOREFRONT_BUILD: ${{ github.workspace }}/vc-frontend/dist
          VC_STOREFRONT_DIR: ${{ github.workspace }}/vc-frontend
        run: |
          dotnet test tests/VirtoCommerce.SalesRep.Tests/VirtoCommerce.SalesRep.Tests.csproj --no-build \
            --filter "Category=StorefrontE2E|Category=VCShellAppE2E" \
            --logger "console;verbosity=normal" 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Summary
        if: always()
        env:
          FRONTEND_REF: ${{ steps.storefront.outputs.ref }}
        run: |
          {
            echo "### E2E tests"
            echo "- Module: ${GITHUB_REF_NAME} at $(git -C vc-module-sales-rep rev-parse --short HEAD)"
            echo "- Storefront: vc-frontend ${FRONTEND_REF} at $(git -C vc-frontend rev-parse --short HEAD 2>/dev/null || echo 'no checkout')"
            grep -E "^Test Run (Successful|Failed|Aborted)|^\s*(Total tests|Passed|Failed|Skipped): " "$RUNNER_TEMP/e2e.log" 2>/dev/null \
              | sed -E 's/^\s+//; s/^/- /' || echo "- The tests did not run."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: |
            vc-module-sales-rep/tests/VirtoCommerce.SalesRep.Tests/bin/Debug/net10.0/StorefrontE2E-diagnostics/
            vc-module-sales-rep/tests/VirtoCommerce.SalesRep.Tests/bin/Debug/net10.0/VCShellAppE2E-diagnostics/
          if-no-files-found: ignore
