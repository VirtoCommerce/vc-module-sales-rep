<div style="font-family:helvetica,'helvetica neue',arial,verdana,sans-serif;background:#f6f6f6;padding:24px;margin:0">
    <table width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px">
        <tbody>
            <tr>
                <td style="padding:32px 32px 8px 32px">
                    {{ if title != null && title != "" }}
                    <h1 style="margin:0 0 16px 0;font-size:20px;line-height:1.3;color:#1a1a1a">{{ title }}</h1>
                    {{ end }}
                    <div style="font-size:15px;line-height:1.6;color:#333333;white-space:pre-wrap">{{ message }}</div>
                </td>
            </tr>
            <tr>
                <td style="padding:24px 32px 32px 32px;border-top:1px solid #eeeeee;color:#999999;font-size:12px;line-height:1.5">
                    You are receiving this message from your sales representative.
                </td>
            </tr>
        </tbody>
    </table>
</div>
