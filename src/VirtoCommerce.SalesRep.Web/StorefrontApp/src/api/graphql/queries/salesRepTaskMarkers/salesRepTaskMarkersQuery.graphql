# The calendar dots need a day and a state per task, not the task: the list's fragment would also resolve its
# customer, a membership and member lookup per fetch for a name the grid never shows.
query SalesRepTaskMarkers(
  $first: Int
  $after: String
  $sort: String
  $today: DateTime
  $period: SalesRepStatisticsPeriodInput
) {
  salesRepTasks(first: $first, after: $after, sort: $sort, today: $today, period: $period) {
    items {
      id
      dueDate
      isActive
      completed
    }
  }
}
