  salesRepCustomerOrderStatistics(
    organizationId: $organizationId
    storeId: $storeId
    currencyCode: $currencyCode
    cultureName: $cultureName
  ) {
    currencyCode
    # The month before the first one, so the first month also gets its "vs previous month" figure.
    prev: period(from: $prevFrom, to: $prevTo) {
      total {
        amount
      }
      count
    }
    prevc: period(from: $prevFrom, to: $prevTo, filter: $cancelledFilter) @skip(if: $noCancelled) {
      total {
        amount
      }
      count
    }
    m0: period(from: $from0, to: $to0) @include(if: $use0) {
      total {
        amount
      }
      count
    }
    mc0: period(from: $from0, to: $to0, filter: $cancelledFilter) @include(if: $use0) @skip(if: $noCancelled) {
