# Reporting (VCST-6255): one bucket per month of the selected period (up to 12), each with the same month last
# year. The statistics already leave Cancelled orders out; the Cancelled rule slice is fetched beside each period and
# subtracted client-side as a safety net (the API has no "all but cancelled" filter). `use<N>` switches off the slots a
# shorter period does not fill; `noCancelled` drops the cancelled slices while the rep has no
# cancelled orders (the rule is data-derived and then does not exist).
query SalesRepMonthlyOrderStatistics(
  $organizationId: String
  $storeId: String
  $currencyCode: String
  $cultureName: String
  $cancelledFilter: String
  $noCancelled: Boolean!
  $prevFrom: DateTime
  $prevTo: DateTime
  $use0: Boolean!
  $from0: DateTime
  $to0: DateTime
  $lyFrom0: DateTime
  $lyTo0: DateTime
  $use1: Boolean!
  $from1: DateTime
  $to1: DateTime
  $lyFrom1: DateTime
  $lyTo1: DateTime
  $use2: Boolean!
  $from2: DateTime
  $to2: DateTime
  $lyFrom2: DateTime
  $lyTo2: DateTime
  $use3: Boolean!
  $from3: DateTime
  $to3: DateTime
  $lyFrom3: DateTime
  $lyTo3: DateTime
  $use4: Boolean!
  $from4: DateTime
  $to4: DateTime
  $lyFrom4: DateTime
  $lyTo4: DateTime
