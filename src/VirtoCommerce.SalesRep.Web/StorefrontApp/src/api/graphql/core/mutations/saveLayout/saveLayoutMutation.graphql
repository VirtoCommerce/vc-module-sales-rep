# A full-document replace of the signed-in user's own layout (the user comes from the token). Returns the
# document as stored; useSalesRepLayout checks the echo against what was sent, so the selection must match the query.
mutation SaveLayout($command: InputLayout!) {
  saveLayout(command: $command) {
    regions {
      id
      blocks {
        id
        type
        hidden
        settings {
          key
          value
        }
      }
    }
  }
}
