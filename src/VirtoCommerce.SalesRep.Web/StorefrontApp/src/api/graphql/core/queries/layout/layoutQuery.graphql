# The signed-in user's saved document for one dashboard, from the core schema (VirtoCommerce.XFrontend): the
# backend takes the user from the token. Null when the user never saved this dashboard.
query Layout($scope: String!, $storeId: String) {
  layout(scope: $scope, storeId: $storeId) {
    regions {
      id
      blocks {
        id
        type
        hidden
        settings {
          key
          value
        }
      }
    }
  }
}
